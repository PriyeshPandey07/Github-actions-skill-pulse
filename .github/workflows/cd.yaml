name: CD Workflow

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute remote ssh command using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            git clone https://github.com/PriyeshPandey07/Github-actions-skill-pulse.git
            cd ~/Github-actions-skill-pulse
            git pull origin main
            docker compose pull
            docker compose up -d 